<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Checklist Audit 5S</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="container mt-5">
    <div class="row">
      <!-- Form Input -->
      <div class="col-md-4">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            Form Audit Checklist 5S
          </div>
          <div class="card-body">
            <form id="formAudit">
              <div class="mb-3">
                <label for="auditor" class="form-label">Nama Auditor</label>
                <input
                  type="text"
                  id="auditor"
                  class="form-control"
                  placeholder="Masukkan nama auditor"
                  required
                />
              </div>

              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="seiri" />
                <label class="form-check-label" for="seiri">Seiri</label>
              </div>

              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="seiton" />
                <label class="form-check-label" for="seiton">Seiton</label>
              </div>

              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="seiso" />
                <label class="form-check-label" for="seiso">Seiso</label>
              </div>

              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="seiketsu" />
                <label class="form-check-label" for="seiketsu">Seiketsu</label>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="shitsuke" />
                <label class="form-check-label" for="shitsuke">Shitsuke</label>
              </div>

              <button type="submit" class="btn btn-success w-100">
                Simpan Audit
              </button>

              <button
                type="button"
                id="btnHapusSemua"
                class="btn btn-danger w-100 mt-2"
              >
                Hapus Semua Riwayat
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabel Riwayat -->
      <div class="col-md-8">
        <h3>Riwayat Audit 5S</h3>
        <table class="table table-bordered table-striped mt-3">
          <thead class="table-dark">
            <tr>
              <th>Tanggal</th>
              <th>Auditor</th>
              <th>Skor</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelBody">
            <!-- Data audit tampil di sini -->
          </tbody>
        </table>
      </div>
    </div>

    <script src="Audit5.js"></script>
  </body>
</html>
